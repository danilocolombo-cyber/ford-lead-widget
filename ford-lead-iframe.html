<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ford Interauto – richiedi informazioni</title><style>html,body{margin:0;padding:4px;background:transparent}</style></head><body>
<script>
(function(){
  var d=document.createElement("div"); d.setAttribute("data-ford-lead-widget","");
  var P=new URLSearchParams(location.search), cfg={product:P.get("product")==="pro"?"pro":"puma",endpoint:"",privacy:"",phone:""};
  ["endpoint","privacy","phone"].forEach(function(k){if(P.get(k))cfg[k]=P.get(k);});
  d.setAttribute("data-product",cfg.product);
  if(cfg.endpoint) d.setAttribute("data-endpoint",cfg.endpoint);
  if(cfg.privacy) d.setAttribute("data-privacy",cfg.privacy);
  if(cfg.phone) d.setAttribute("data-phone",cfg.phone);
  document.body.appendChild(d);
  d.addEventListener("ford-lead:complete",function(e){var x=e.detail;
    parent.postMessage({fordLead:"complete",segment:x.segment,score:x.score,product:x.product,tags:x.tags},"*");});
  function h(){parent.postMessage({fordLeadHeight:document.documentElement.scrollHeight},"*");}
  if(window.ResizeObserver) new ResizeObserver(h).observe(document.body); window.addEventListener("load",h);
})();
</script>
<script>
/*! Ford Interauto – widget multistep di qualificazione lead (Puma / Ford Pro)
 *  Un solo file, nessuna dipendenza. Stili isolati con Shadow DOM.
 *  Uso:  <div data-ford-lead-widget data-product="puma"></div>
 *        <script src="ford-lead-widget.js" async><\/script>
 *  Attributi: data-product (puma|pro), data-endpoint (webhook/CRM, POST JSON),
 *             data-privacy (URL informativa), data-phone (telefono mostrato a fine flusso)
 *  Eventi sull’elemento: "ford-lead:complete" (detail = payload completo).
 *  dataLayer: push { event: "ford_lead_hot|warm|cold" } senza dati personali.
 */
(function () {
  "use strict";

  var SEG = { hot: "hot", warm: "warm", cold: "cold" };

  var DATA = {
    puma: {
      skip: ["q2", "q3"],
      td: "il test drive",
      ST: {
        q1: { t: "Quando pensi di acquistare la tua prossima auto?", o: [["Entro 1 mese", 30, "now"], ["Tra 1 e 3 mesi", 20], ["Tra 3 e 6 mesi", 10], ["Sto solo guardando", 0, "browse"]] },
        q2: { t: "Qual è il tuo budget indicativo?", o: [["Oltre 30.000 €", 20], ["25.000 – 30.000 €", 15], ["20.000 – 25.000 €", 8], ["Non lo so ancora", 5], ["Sotto 20.000 €", 0, "low"]] },
        q3: { t: "Come preferisci acquistare?", o: [["Finanziamento", 15], ["Contanti", 15], ["Noleggio a lungo termine", 12, "nlt"], ["Non lo so ancora", 5]] },
        q3x: { t: "Sei un privato o hai una Partita IVA?", o: [["Privato", 0, "priv"], ["Partita IVA o azienda", 0, "biz"]] },
        q4: { t: "Hai un’auto da permutare?", o: [["Sì", 10, "yes"], ["No, è la mia prima auto", 7], ["No, tengo l’auto attuale", 3]] },
        q5: { t: "Cosa vorresti fare ora?", o: [["Prenotare un test drive", 25, "td"], ["Ricevere un preventivo personalizzato", 18, "quote b"], ["Parlare con un consulente", 15], ["Solo avere informazioni", 5, "info b"]] },
        q5x: { t: "Quando preferisci fare il test drive?", o: [["Mattina"], ["Pomeriggio"], ["Weekend"]] }
      }
    },
    pro: {
      skip: ["q3"],
      td: "la prova su strada",
      ST: {
        type: { t: "Che tipo di veicolo ti serve?", o: [["Furgone compatto"], ["Furgone medio o grande"], ["Pick-up"], ["Allestito o trasformato", 0, "custom"], ["Non lo so ancora"]] },
        biz: { t: "Hai una Partita IVA o rappresenti un’azienda?", o: [["Sì", 0, "biz"], ["No, sono un privato", 0, "priv"]] },
        q1: { t: "Quando ti serve il veicolo?", o: [["Entro 1 mese", 25, "now"], ["Tra 1 e 3 mesi", 17], ["Tra 3 e 6 mesi", 8], ["Sto solo valutando", 0, "browse"]] },
        q2: { t: "Quanti veicoli ti servono?", o: [["Oltre 10", 20, "fleet"], ["Da 6 a 10", 18], ["Da 2 a 5", 14], ["1", 8, "one"]] },
        q3: { t: "Come preferisci acquisire il mezzo?", o: [["Noleggio a lungo termine", 15, "nlt"], ["Leasing o finanziamento", 15], ["Acquisto in contanti", 12], ["Non lo so ancora", 5]] },
        q3x: { t: "Che durata e quanti km all’anno ti servono?", o: [["36 mesi / 30.000 km"], ["48 mesi / 40.000 km"], ["Altra formula, da definire"]] },
        q4: { t: "Devi sostituire un veicolo esistente?", o: [["Sì, da permutare o rivendere", 10, "yes"], ["No, amplio la flotta", 8], ["No, è il primo mezzo dell’attività", 5]] },
        q5: { t: "Cosa vorresti fare ora?", o: [["Prenotare una prova su strada", 30, "td"], ["Ricevere un preventivo personalizzato", 22, "quote b"], ["Parlare con un consulente Ford Pro", 18], ["Solo avere informazioni", 5, "info b"]] },
        q5x: { t: "Quando preferisci fare la prova su strada?", o: [["Mattina"], ["Pomeriggio"]] }
      }
    }
  };

  var CSS = ':host{all:initial;display:block;font-family:"FordAntenna","Helvetica Neue",Helvetica,Arial,sans-serif;color:#00095b;--navy:#00095b;--blue:#1700f4;--line:#d5dae3;--bg:#f2f4f8}' +
    "*{box-sizing:border-box}" +
    ".w{max-width:640px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px}" +
    ".bar{display:flex;gap:6px;margin-bottom:10px}.bar i{flex:1;height:4px;border-radius:2px;background:var(--line)}.bar i.on{background:var(--navy)}" +
    ".meta{font-size:14px;color:#4a5280;margin:0 0 22px}" +
    "h2{font-size:26px;line-height:1.2;font-weight:600;margin:0 0 20px;outline:none}" +
    "p{line-height:1.5;margin:0 0 14px;font-size:17px}" +
    ".opts{display:grid;gap:10px}" +
    ".opt{font:inherit;font-size:17px;text-align:left;padding:16px 18px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--navy);cursor:pointer;width:100%}" +
    ".opt:hover{border-color:var(--navy);background:var(--bg)}" +
    '.opt[aria-checked="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}' +
    ":focus-visible{outline:3px solid var(--blue);outline-offset:2px}" +
    ".btn{font:inherit;font-size:17px;font-weight:600;border:0;border-radius:999px;padding:15px 32px;background:var(--navy);color:#fff;cursor:pointer}" +
    ".btn:hover{background:#0a1a8f}.btn[disabled]{opacity:.55;cursor:default}" +
    ".ghost{font:inherit;font-size:16px;background:none;border:0;color:var(--navy);text-decoration:underline;cursor:pointer;padding:10px 4px}" +
    "label.f{display:block;font-size:14px;margin:0 0 14px}" +
    "input[type=text],input[type=tel],input[type=email]{font:inherit;font-size:17px;width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;margin-top:6px;color:var(--navy);background:#fff}" +
    ".err{color:#b00020;font-size:14px;margin:4px 0 0;min-height:0}" +
    ".chk{display:flex;gap:10px;font-size:14px;line-height:1.4;margin:10px 0}.chk input{width:20px;height:20px;margin:0;flex:none}" +
    ".chk a{color:var(--navy)}" +
    ".row{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}" +
    ".nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:12px}" +
    ".hp{position:absolute;left:-9999px;height:0;overflow:hidden}" +
    ".call{display:inline-block;margin-top:6px;font-weight:600;color:var(--navy)}" +
    "@media(max-width:480px){.row{grid-template-columns:1fr}.w{padding:20px}h2{font-size:22px}}" +
    "@media(prefers-reduced-motion:no-preference){.step{animation:in .22s ease-out}@keyframes in{from{opacity:0;transform:translateX(10px)}}}";

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  function mount(host, opts) {
    if (host.__fl) return;
    host.__fl = 1;
    var pro = opts.product === "pro";
    var cfg = DATA[pro ? "pro" : "puma"];
    var ST = cfg.ST;
    var root = host.attachShadow({ mode: "open" });
    var a = {}, hist = [], cur = null, curOpts = [], contact = null;
    var utm = {};
    try { new URLSearchParams(location.search).forEach(function (v, k) { if (/^utm_|^gclid$|^fbclid$/.test(k)) utm[k] = v; }); } catch (e) {}

    function has(id, k) { return !!(a[id] && (" " + a[id].k + " ").indexOf(" " + k + " ") > -1); }

    function flow() {
      var f = [], b = has("q1", "browse");
      if (pro) { f.push("type"); if (has("type", "custom")) f.push("allest"); f.push("biz"); }
      f.push("q1");
      ["q2", "q3"].forEach(function (q) {
        if (b && cfg.skip.indexOf(q) > -1) return;
        f.push(q);
        if (q === "q3" && has("q3", "nlt")) f.push("q3x");
      });
      f.push("q4"); if (has("q4", "yes")) f.push("q4x");
      f.push("q5"); if (has("q5", "td")) f.push("q5x");
      f.push("form");
      return f;
    }

    function score() {
      var s = 0;
      flow().forEach(function (id) { if (/^q[1-5]$|^q4x$/.test(id) && a[id]) s += a[id].p || 0; });
      return Math.min(100, s);
    }

    function segment(s) {
      var hot = (has("q1", "now") && has("q5", "td")) || (pro && has("q2", "fleet"));
      var cold = pro ? (has("q2", "one") && has("q1", "browse") && has("q5", "info")) : (has("q2", "low") && !has("q3", "nlt"));
      if (hot) return SEG.hot;
      if (cold) return SEG.cold;
      return s >= 70 ? SEG.hot : s >= 40 ? SEG.warm : SEG.cold;
    }

    function shell(id, inner) {
      var f = flow(), i = f.indexOf(id), bar = "";
      f.forEach(function (_, n) { bar += '<i class="' + (n <= i ? "on" : "") + '"></i>'; });
      root.innerHTML = "<style>" + CSS + '</style><div class="w"><div class="bar" role="progressbar" aria-valuemin="1" aria-valuemax="' + f.length + '" aria-valuenow="' + (i + 1) + '">' + bar + '</div><p class="meta">Passo ' + (i + 1) + " di " + f.length + '</p><div class="step">' + inner + "</div></div>";
      var h = root.querySelector("h2"); if (h) { h.setAttribute("tabindex", "-1"); h.focus({ preventScroll: true }); }
    }

    function navRow(extra) {
      return '<div class="nav">' + (hist.length ? '<button type="button" class="ghost" data-back>Indietro</button>' : "<span></span>") + (extra || "") + "</div>";
    }

    function show(id, back) {
      if (!back && cur) hist.push(cur);
      cur = id;
      if (ST[id]) return choice(id);
      if (id === "q4x") return fields();
      if (id === "allest") return allest();
      form();
    }

    function next() { var f = flow(); show(f[f.indexOf(cur) + 1]); }
    function prev() { if (hist.length) show(hist.pop(), true); }

    function wireBack() { var b = root.querySelector("[data-back]"); if (b) b.onclick = prev; }

    function choice(id) {
      var s = ST[id], o = s.o;
      if (id === "q5" && has("q1", "browse")) o = o.filter(function (x) { return /\bb\b/.test(x[2] || ""); });
      curOpts = o;
      var html = '<h2 id="h">' + esc(s.t) + '</h2><div class="opts" role="radiogroup" aria-labelledby="h">';
      o.forEach(function (x, i) { html += '<button type="button" class="opt" role="radio" aria-checked="' + !!(a[id] && a[id].l === x[0]) + '" data-i="' + i + '">' + esc(x[0]) + "</button>"; });
      shell(id, html + "</div>" + navRow());
      root.querySelectorAll(".opt").forEach(function (btn) {
        btn.onclick = function () {
          var x = curOpts[+btn.getAttribute("data-i")];
          a[id] = { l: x[0], p: x[1] || 0, k: x[2] || "" };
          root.querySelectorAll(".opt").forEach(function (b) { b.setAttribute("aria-checked", b === btn); });
          setTimeout(next, 170);
        };
      });
      wireBack();
    }

    function fields() {
      var v = a.q4x ? a.q4x.v : {};
      function inp(n, l, ph) { return '<label class="f">' + l + '<input type="text" name="' + n + '" value="' + esc(v[n] || "") + '" placeholder="' + ph + '"></label>'; }
      shell("q4x", '<h2 id="h">Che auto vuoi permutare?</h2><p>Facoltativo: ci serve per una prima valutazione.</p><div class="row">' + inp("marca", "Marca", "Es. Fiat") + inp("modello", "Modello", "Es. Panda") + inp("anno", "Anno", "Es. 2017") + inp("km", "Chilometri", "Es. 85000") + "</div>" +
        navRow('<span><button type="button" class="ghost" data-skip>Salta</button> <button type="button" class="btn" data-ok>Continua</button></span>'));
      wireBack();
      function read() { var o = {}; ["marca", "modello", "anno", "km"].forEach(function (n) { o[n] = root.querySelector('[name="' + n + '"]').value.trim(); }); return o; }
      root.querySelector("[data-skip]").onclick = function () { delete a.q4x; next(); };
      root.querySelector("[data-ok]").onclick = function () { var o = read(); a.q4x = { l: [o.marca, o.modello, o.anno, o.km].join(" "), v: o, p: o.marca && o.modello ? 5 : 0, k: "" }; next(); };
    }

    function allest() {
      shell("allest", '<h2 id="h">A cosa deve servire l’allestimento?</h2><label class="f">Descrivi l’uso<input type="text" name="u" value="' + esc(a.allest ? a.allest.l : "") + '" placeholder="Es. frigo, officina mobile, trasporto persone"></label>' +
        navRow('<button type="button" class="btn" data-ok>Continua</button>'));
      wireBack();
      root.querySelector("[data-ok]").onclick = function () { a.allest = { l: root.querySelector('[name="u"]').value.trim(), p: 0, k: "custom" }; next(); };
    }

    function form() {
      var c = contact || {};
      function inp(n, l, t, ac) { return '<label class="f">' + l + '<input type="' + t + '" name="' + n + '" autocomplete="' + ac + '" value="' + esc(c[n] || "") + '"><span class="err" data-e="' + n + '"></span></label>'; }
      shell("form", '<h2 id="h">Ultimo passo: come ti contattiamo?</h2><form novalidate><div class="row">' + inp("nome", "Nome e cognome", "text", "name") + (pro ? inp("azienda", "Ragione sociale", "text", "organization") : "") + inp("tel", "Telefono", "tel", "tel") + inp("email", "Email", "email", "email") + inp("cap", "CAP", "text", "postal-code") + "</div>" +
        '<div class="hp" aria-hidden="true"><input type="text" name="website" tabindex="-1" autocomplete="off"></div>' +
        '<label class="chk"><input type="checkbox" name="privacy"><span>Ho letto l’<a href="' + esc(opts.privacy) + '" target="_blank" rel="noopener">informativa privacy</a> e acconsento al trattamento dei dati per essere ricontattato. <span class="err" data-e="privacy"></span></span></label>' +
        '<label class="chk"><input type="checkbox" name="mkt"><span>Facoltativo: acconsento a ricevere offerte e comunicazioni commerciali da Interauto.</span></label>' +
        navRow('<button type="submit" class="btn">Invia richiesta</button>') + '<p class="err" data-e="send" role="alert"></p></form>');
      wireBack();
      var fm = root.querySelector("form");
      fm.onsubmit = function (ev) {
        ev.preventDefault();
        var q = function (n) { return fm.querySelector('[name="' + n + '"]'); };
        var d = { nome: q("nome").value.trim(), tel: q("tel").value.trim(), email: q("email").value.trim(), cap: q("cap").value.trim(), azienda: pro ? q("azienda").value.trim() : "" };
        contact = d;
        var e = {};
        if (d.nome.length < 2) e.nome = "Inserisci il tuo nome.";
        if (pro && has("biz", "biz") && !d.azienda) e.azienda = "Inserisci la ragione sociale.";
        if (d.tel.replace(/\D/g, "").length < 6) e.tel = "Inserisci un numero valido.";
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email)) e.email = "Inserisci un’email valida.";
        if (!/^\d{5}$/.test(d.cap)) e.cap = "Il CAP ha 5 cifre.";
        if (!q("privacy").checked) e.privacy = "Il consenso è necessario per inviare la richiesta.";
        fm.querySelectorAll("[data-e]").forEach(function (s) { s.textContent = e[s.getAttribute("data-e")] || ""; });
        var first = Object.keys(e)[0];
        if (first) { var el = q(first); if (el) el.focus(); return; }
        if (q("website").value) return finish("cold", d, false, true);
        submit(d, q("mkt").checked, fm);
      };
    }

    function payload(d, mkt) {
      var f = flow(), s = score(), seg = segment(s), ans = {}, tags = {};
      f.forEach(function (id) {
        if (!a[id]) return;
        ans[id] = a[id].v || a[id].l;
        (a[id].k || "").split(" ").forEach(function (k) { if (/^(biz|priv|nlt|fleet|custom)$/.test(k)) tags[k] = 1; });
      });
      return { product: pro ? "ford-pro" : "puma", score: s, segment: seg, tags: Object.keys(tags), answers: ans, contact: d, consent: { privacy: true, marketing: !!mkt }, utm: utm, page: location.href, ts: new Date().toISOString() };
    }

    function submit(d, mkt, fm) {
      var p = payload(d, mkt), btn = fm.querySelector('[type="submit"]'), err = fm.querySelector('[data-e="send"]');
      btn.disabled = true; btn.textContent = "Invio in corso…"; err.textContent = "";
      var req = opts.endpoint ? fetch(opts.endpoint, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(p), keepalive: true }).then(function (r) { if (!r.ok) throw new Error(r.status); }) : Promise.resolve();
      req.then(function () {
        host.dispatchEvent(new CustomEvent("ford-lead:complete", { detail: p, bubbles: true, composed: true }));
        (window.dataLayer = window.dataLayer || []).push({ event: "ford_lead_" + p.segment, lead_product: p.product, lead_score: p.score });
        finish(p.segment, d, mkt);
      }).catch(function () {
        btn.disabled = false; btn.textContent = "Invia richiesta";
        err.textContent = "Non siamo riusciti a inviare la richiesta. Riprova tra un attimo" + (opts.phone ? " oppure chiamaci." : ".");
      });
    }

    function finish(seg, d, mkt) {
      var f = flow(), td = has("q5", "td") ? cfg.td : "i prossimi passi";
      var T = {
        hot: ["Richiesta ricevuta: ti richiamiamo entro 30 minuti", "Un consulente Interauto ti chiama in orario di apertura per fissare " + td + "."],
        warm: ["Grazie, ti contattiamo entro 24 ore", "Ti scriviamo anche via email con il preventivo e le promozioni in corso."],
        cold: ["Grazie, abbiamo registrato la richiesta", mkt ? "Ti terremo aggiornato sulle novità e sulle promozioni Ford." : "Non riceverai comunicazioni commerciali. Se cambi idea, siamo a tua disposizione."]
      }[seg];
      var tel = opts.phone ? '<p>Preferisci parlare subito?<br><a class="call" href="tel:' + esc(opts.phone.replace(/\s/g, "")) + '">Chiama ' + esc(opts.phone) + "</a></p>" : "";
      root.innerHTML = "<style>" + CSS + '</style><div class="w"><div class="bar">' + f.map(function () { return '<i class="on"></i>'; }).join("") + '</div><div class="step"><h2 id="h"></h2><p></p>' + tel + "</div></div>";
      var h = root.querySelector("h2"); h.textContent = (d.nome ? d.nome.split(" ")[0] + ", " : "") + T[0].charAt(0).toLowerCase() + T[0].slice(1);
      h.textContent = h.textContent.charAt(0).toUpperCase() + h.textContent.slice(1);
      root.querySelector("p").textContent = T[1];
      h.setAttribute("tabindex", "-1"); h.focus({ preventScroll: true });
    }

    show(flow()[0]);
  }

  function auto() {
    var nodes = document.querySelectorAll("[data-ford-lead-widget],#ford-lead-widget");
    Array.prototype.forEach.call(nodes, function (n) {
      mount(n, {
        product: n.getAttribute("data-product") || "puma",
        endpoint: n.getAttribute("data-endpoint") || "",
        privacy: n.getAttribute("data-privacy") || "https://www.fordinterauto.it/privacy/",
        phone: n.hasAttribute("data-phone") ? n.getAttribute("data-phone") : "02 892949"
      });
    });
  }

  window.FordLeadWidget = { mount: mount, init: auto };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", auto); else auto();
})();

</script>
</body></html>
